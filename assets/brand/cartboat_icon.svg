<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13808A"/>
      <stop offset="1" stop-color="#0A4550"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#FF5A2E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g id="mark" transform="translate(24 -6)">
    <!-- jib sail -->
    <path d="M470 318 L470 562 Q470 578 454 578 L326 578 Q306 578 318 562 Z" fill="#E6F6F3" stroke="#E6F6F3" stroke-width="10" stroke-linejoin="round"/>
    <!-- main sail shaped as a price tag -->
    <path d="M532 236 L532 562 Q532 578 548 578 L768 578 Q792 578 776 558 Z" fill="url(#sail)" stroke="url(#sail)" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="586" cy="452" r="24" fill="#0E5F68"/>
    <!-- mast -->
    <line x1="501" y1="214" x2="501" y2="606" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <!-- cart handle at the stern -->
    <path d="M276 634 L218 548 L160 548" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- hull / basket -->
    <path d="M262 618 L800 618 Q822 618 815 640 L752 778 Q744 796 724 796 L350 796 Q330 796 322 778 L246 640 Q238 618 262 618 Z" fill="#FFFFFF"/>
    <line x1="420" y1="666" x2="430" y2="748" stroke="#0E5F68" stroke-width="18" stroke-linecap="round"/>
    <line x1="534" y1="666" x2="534" y2="748" stroke="#0E5F68" stroke-width="18" stroke-linecap="round"/>
    <line x1="648" y1="666" x2="638" y2="748" stroke="#0E5F68" stroke-width="18" stroke-linecap="round"/>
    <!-- wave -->
    <path d="M206 870 q 51 -40 102 0 t 102 0 t 102 0 t 102 0 t 102 0 t 102 0" fill="none" stroke="#6FE0D2" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
