name: cartboat
description: "CartBoat — a multi-vendor marketplace app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  animations: ^3.0.0
  cached_network_image: ^4.0.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  smooth_page_indicator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Phosphor Icons (MIT) — glyph tables live in lib/core/theme/phosphor_icons.g.dart
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Duotone.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/cartboat_icon.png"
  adaptive_icon_background: "#0E5F68"
  adaptive_icon_foreground: "assets/brand/cartboat_foreground.png"
  # The foreground PNG already sits inside the 66% safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/brand/cartboat_icon.png"
    background_color: "#0E5F68"
    theme_color: "#0E5F68"

flutter_native_splash:
  color: "#0E5F68"
  image: "assets/brand/cartboat_foreground.png"
  android_12:
    color: "#0E5F68"
    image: "assets/brand/cartboat_foreground.png"
    icon_background_color: "#0E5F68"
  web: false
